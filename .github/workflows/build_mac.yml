name: Build macOS App AutoReviewLite

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-13  # Sử dụng runner Intel/Universal tương thích tốt nhất

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install pyinstaller ffmpeg-python PyQt6 google-genai
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Build macOS App via PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name=AutoReviewLite --add-data=src:src --clean main.py

    - name: Zip Release Artifact
      run: |
        cd dist
        zip -r AutoReviewLite_macOS.zip AutoReviewLite.app

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AutoReviewLite_macOS
        path: dist/AutoReviewLite_macOS.zip
