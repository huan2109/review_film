name: Build macOS App AutoReviewLite

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller ffmpeg-python

    - name: Install FFmpeg via Homebrew
      run: |
        brew install ffmpeg

    - name: Build macOS App via PyInstaller
      run: |
        python build_mac.py

    - name: Archive Release App Zip
      run: |
        cd dist
        zip -r AutoReviewLite_macOS.zip AutoReviewLite.app

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: AutoReviewLite_macOS
        path: dist/AutoReviewLite_macOS.zip
